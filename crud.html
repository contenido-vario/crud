<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dejar solo la última versión del script para el navegador -->
  <script src="https://cdn.tailwindcss.com"></script>
  <title>CRUD</title>
</head>

<body class="min-h-screen bg-gray-50 text-gray-900 font-sans">

  <header>
    
    <!-- 1. NAVBAR CON LOS 4 BOTONES DE OPERACIÓN -->
    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-0 z-10 shadow-sm">
      <div class="font-bold text-lg text-gray-800 tracking-wide uppercase">Mantenimiento de Libros</div>
      
      <!-- Grupo de botones (Guardarán el estado global en JS: 1, 2, 3 o 4) -->
      <div class="flex flex-wrap gap-2">
        <button id="btn-agregar" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          1. AGREGAR
        </button>
        <button id="btn-modificar" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-amber-500 focus:ring-offset-2">
          2. MODIFICAR
        </button>
        <button id="btn-eliminar" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
          3. ELIMINAR
        </button>
        <button id="btn-mostrar" class="bg-slate-600 hover:bg-slate-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">
          4. MOSTRAR
        </button>
      </div>
    </nav>
  </header>
  <!-- CONTENEDOR PRINCIPAL -->
  <main class="max-w-2xl mx-auto p-6">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      
      <!-- Indicador visual del modo actual (Ayuda mucho al usuario) -->
      <div class="mb-6 p-3 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium text-center" id="estado-operacion">
        Selecciona una operación en el menú superior para comenzar
      </div>

      <!-- FORMULARIO -->
      <form id="form-libro" class="space-y-5">
        
        <!-- Campo ISBN: Clave primaria (Fuera del fieldset, controlado por JS) -->
        <div>
          <label for="isbn" class="block text-sm font-medium text-gray-700 mb-1">ISBN (Código Clave). Ejemplo 978-3-16-148410-0</label>
          <input type="text" id="isbn" disabled
                class="w-full font-mono border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed"
                placeholder="Ejemplo 978-3-16-148410-0">
          <p class="text-xs text-gray-400 mt-1">Presiona la tecla Enter o Tab al terminar de escribir para buscar.</p>
        </div>

        <hr class="border-gray-200 my-4">

        <!-- FIELDSET QUE AGRUPA EL RESTO DE CAMPOS -->
        <fieldset id="campos-libro" disabled class="space-y-5 group disabled:opacity-60 transition-opacity">
          
          <!-- Campo Título (No modificable en la opción 2, lleva data-info) -->
          <div>
            <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">Título del Libro</label>
            <input type="text" id="titulo" data-info="fijo"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow disabled:bg-gray-50">
          </div>

          <!-- Campo Autor (No modificable en la opción 2, lleva data-info) -->
          <div>
            <label for="autor" class="block text-sm font-medium text-gray-700 mb-1">Autor</label>
            <input type="text" id="autor" data-info="fijo"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow disabled:bg-gray-50">
          </div>

          <!-- Dos columnas para Stock y Precio -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Campo Stock (SÍ modificable en la opción 2) -->
            <div>
              <label for="stock" class="block text-sm font-medium text-gray-700 mb-1">Unidades en Stock</label>
              <input type="number" id="stock" data-info="modificable"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow disabled:bg-gray-50">
            </div>

            <!-- Campo Precio (SÍ modificable en la opción 2) -->
            <div>
              <label for="precio" class="block text-sm font-medium text-gray-700 mb-1">Precio (€)</label>
              <input type="number" step="0.01" id="precio" data-info="modificable"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow disabled:bg-gray-50">
            </div>
          </div>

        </fieldset>

        <!-- Botones de Acción del Formulario (Aceptar / Cancelar) -->
        <div id="acciones-formulario" class="hidden flex justify-end gap-3 pt-4 border-t border-gray-100">
          <button type="button" id="btn-cancelar" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button type="submit" id="btn-confirmar" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium transition-colors shadow-sm">
            Guardar Cambios
          </button>
        </div>

      </form>
      
    </div>
  
 
    <!-- DIÁLOGO MODAL -->
    <dialog id="dialog-informativo" class="rounded-xl shadow-xl max-w-sm w-full p-6 border border-gray-100 backdrop:bg-black/50 backdrop:backdrop-blur-sm">
      <div class="flex items-center gap-3 text-amber-600 mb-3">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <h3 class="text-lg font-bold text-gray-900" id="info-titulo">Aviso del Sistema</h3>
      </div>
      <p class="text-sm text-gray-600 mb-6" id="info-mensaje">Mensaje.</p>
      <div class="flex justify-end">
        <button id="info-btn-aceptar" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors shadow-sm">Ok</button>
      </div>
    </dialog>


  </main>

  <script src="./js/clase-libro.js"></script>
  <script src="./js/libros.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
